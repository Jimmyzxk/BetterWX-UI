name: Build BetterWX-UI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 👇 *** 这是被修正的步骤 *** 👇
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build the application
        # 使用 tauri-action 可以更好地处理缓存和打包
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: app-v__VERSION__ # 可选：用于创建 GitHub Release 的标签模板
          releaseName: 'App v__VERSION__' # 可选：Release 的名称
          releaseBody: 'See the assets to download this version.' # 可选：Release 的描述
          releaseDraft: true # 可选：创建为草稿 Release
          prerelease: false # 可选：标记为预发布

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterWX-UI-Build-${{ github.run_id }}
          path: src-tauri/target/release/bundle/ # BetterWX-UI 编译后产物的路径
