# .github/workflows/release.yml

name: 'Publish Release'

# 触发条件：当一个格式为 'v*.*.*' 的新标签被推送到仓库时，此工作流将被触发。
# 例如：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'
  # 同时也允许在 Actions 页面手动触发此工作流，方便测试。
  workflow_dispatch:

jobs:
  # --- 任务1：并行编译所有平台的应用 ---
  build:
    # 使用策略矩阵，为每个目标平台创建一个并行的构建任务。
    strategy:
      fail-fast: false # 如果一个平台的构建失败，其他平台的构建任务仍会继续。
      matrix:
        # 定义每个平台所需的不同配置。
        include:
          - platform: 'macos-latest'
            os: 'macOS'
            target: 'apple-darwin'
            asset_name_suffix: '.app.tar.gz' # 输出的压缩包后缀
            asset_path: 'src-tauri/target/release/bundle/macos/*.app' # 原始产物路径
            asset_content_type: 'application/x-gzip'
            
          - platform: 'ubuntu-latest'
            os: 'Linux'
            target: 'x86_64-unknown-linux-gnu'
            asset_name_suffix: '.AppImage.tar.gz'
            asset_path: 'src-tauri/target/release/bundle/appimage/*.AppImage'
            asset_content_type: 'application/x-gzip'

          - platform: 'windows-latest'
            os: 'Windows'
            target: 'x86_64-pc-windows-msvc'
            asset_name_suffix: '.msi.zip'
            asset_path: 'src-tauri/target/release/bundle/msi/*.msi'
            asset_content_type: 'application/zip'

    # 指定任务运行在哪个虚拟环境上，由矩阵变量决定。
    runs-on: ${{ matrix.platform }}

    steps:
      # 步骤1：检出你的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：安装 Node.js (用于前端构建)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 步骤3：安装 Rust 工具链 (用于后端构建)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }} # 安装对应平台的构建目标

      # 步骤4：安装 Linux 系统依赖 (此步骤仅在 Ubuntu 环境下运行)
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # 步骤5：安装项目的前端依赖
      - name: Install frontend dependencies
        run: npm install

      # 步骤6：使用 Tauri 官方 Action 进行编译
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      # 步骤7：压缩构建好的产物，统一格式，方便上传
      - name: Compress assets
        shell: bash # 使用 bash 来确保跨平台脚本的一致性
        run: |
          # 根据操作系统类型执行不同的压缩命令
          if [ "${{ matrix.os }}" == "macOS" ]; then
            tar -czf release-asset${{ matrix.asset_name_suffix }} -C src-tauri/target/release/bundle/macos/ *.app
          elif [ "${{ matrix.os }}" == "Linux" ]; then
            tar -czf release-asset${{ matrix.asset_name_suffix }} -C src-tauri/target/release/bundle/appimage/ *.AppImage
          elif [ "${{ matrix.os }}" == "Windows" ]; then
            # 在 Windows Runner 上使用 PowerShell
            powershell -Command "Compress-Archive -Path ${{ matrix.asset_path }} -DestinationPath release-asset${{ matrix.asset_name_suffix }}"
          fi

      # 步骤8：上传压缩好的产物，以便后续的发布任务使用
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.os }} # 为每个平台的产物命名
          path: release-asset* # 上传所有以 release-asset 开头的文件

  # --- 任务2：将所有产物统一发布到 GitHub Release ---
  publish-release:
    # 此任务必须在所有 'build' 任务都成功完成后才能运行。
    needs: build
    runs-on: ubuntu-latest # 发布任务本身只需要一个轻量的环境

    steps:
      # 步骤1：下载之前所有平台上传的构建产物
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-* # 匹配所有以 release-asset- 开头的产物
          merge-multiple: true # 将所有下载的产物合并到同一个目录下

      # 步骤2：创建 GitHub Release 并将所有文件作为附件上传
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          # 从触发工作流的 git 标签自动生成 Release 的名称和版本号
          name: 'Release ${{ github.ref_name }}'
          tag_name: ${{ github.ref }}
          # 将当前目录下所有 .zip 和 .tar.gz 文件作为附件上传
          files: |
            *.zip
            *.tar.gz
